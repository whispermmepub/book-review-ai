<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>စာအုပ်အညွှန်း AI - Book Review Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Myanmar',sans-serif;background:#0d0b1e;color:#e0e0e0;min-height:100vh;padding:20px 15px}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;padding:32px 20px;margin-bottom:24px;border-radius:16px;background:linear-gradient(135deg,rgba(10,8,30,0.95),rgba(20,15,50,0.9));border:1px solid rgba(124,140,245,0.15)}
.header h1{font-size:1.8em;font-weight:700;background:linear-gradient(135deg,#7c8cf5,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.header p{color:#9999bb;font-size:0.85em}
.card{background:rgba(20,18,40,0.8);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:24px;margin-bottom:16px;backdrop-filter:blur(8px)}
.card h2{font-size:1.1em;color:#a78bfa;margin-bottom:16px;display:flex;align-items:center;gap:8px}
label{display:block;font-size:0.85em;color:#aaa;margin-bottom:6px;font-weight:500}
input[type="password"],input[type="text"],textarea{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;background:rgba(255,255,255,0.04);color:#e0e0e0;font-family:inherit;font-size:0.9em;outline:none;transition:border 0.2s}
input:focus,textarea:focus{border-color:rgba(124,140,245,0.4)}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.file-upload{border:2px dashed rgba(124,140,245,0.25);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all 0.3s;position:relative}
.file-upload:hover{border-color:rgba(124,140,245,0.5);background:rgba(124,140,245,0.05)}
.file-upload.dragover{border-color:#7c8cf5;background:rgba(124,140,245,0.1)}
.file-upload input[type="file"]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file-upload .icon{font-size:2em;margin-bottom:8px}
.file-upload .text{color:#8888aa;font-size:0.85em}
.file-upload .filename{color:#7c8cf5;font-weight:500;margin-top:8px;display:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:none;border-radius:10px;font-family:inherit;font-size:0.95em;font-weight:600;cursor:pointer;transition:all 0.3s}
.btn-primary{background:linear-gradient(135deg,#7c8cf5,#6366f1);color:white}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(124,140,245,0.3)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-secondary{background:rgba(255,255,255,0.06);color:#ccc;border:1px solid rgba(255,255,255,0.1)}
.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{display:none}
.result.show{display:block}
.result-content{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:20px;line-height:1.8;white-space:pre-wrap;font-size:0.92em;color:#ddd}
.result-content strong{color:#a78bfa}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:0.85em;display:none;margin-top:12px}
.error.show{display:block}
.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:10px;padding:12px 16px;color:#86efac;font-size:0.85em;display:none;margin-top:12px}
.success.show{display:block}
.char-count{font-size:0.75em;color:#666;text-align:right;margin-top:4px}
.prompt-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.preset-btn{padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#aaa;font-size:0.78em;cursor:pointer;transition:all 0.2s;font-family:inherit}
.preset-btn:hover{border-color:rgba(124,140,245,0.4);color:#a78bfa}
.preset-btn.active{border-color:#7c8cf5;color:#a78bfa;background:rgba(124,140,245,0.1)}
.status-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.03);font-size:0.8em;color:#888;margin-bottom:16px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#ef4444;flex-shrink:0}
.status-dot.ok{background:#22c55e}
.api-help{font-size:0.78em;color:#666;margin-top:8px}
.api-help a{color:#7c8cf5;text-decoration:none}
.api-help a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📚 စာအုပ်အညွှန်း AI</h1>
    <p>စာအုပ်ဖိုင်တင်ပြီး Gemini AI နဲ့ အညွှန်းရေးပါ</p>
  </div>

  <!-- API Key -->
  <div class="card">
    <h2>🔑 Gemini API Key</h2>
    <div class="status-bar">
      <div class="status-dot" id="apiStatus"></div>
      <span id="apiStatusText">API Key မထည့်ရသေးပါ</span>
    </div>
    <label>API Key ထည့်ပါ</label>
    <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
    <div class="api-help">
      Key မရှိရင် <a href="https://aistudio.google.com/apikey" target="_blank">ဒီမှာ</a> အခမဲ့ ယူလို့ရတယ်
    </div>
  </div>

  <!-- Book Upload -->
  <div class="card">
    <h2>📖 စာအုပ်ဖိုင်</h2>
    <div class="file-upload" id="fileUpload">
      <input type="file" id="bookFile" accept=".epub,.pdf,.txt">
      <div class="icon">📄</div>
      <div class="text">EPUB, PDF, ဒါမှမဟုတ် TXT ဖိုင်ကို drag & drop လုပ်ပါ<br>ဒါမှမဟုတ် နှိပ်ပြီး ရွေးပါ</div>
      <div class="filename" id="fileName"></div>
    </div>
    <div id="fileInfo" style="display:none;margin-top:10px;font-size:0.8em;color:#888"></div>
  </div>

  <!-- Prompt -->
  <div class="card">
    <h2>✍️ Prompt / ညွှန်ပေးချက်</h2>
    <div class="prompt-presets">
      <button class="preset-btn active" onclick="setPreset('default')">📖 အညွှန်းရေး</button>
      <button class="preset-btn" onclick="setPreset('summary')">📝 အကျဉ်းချုပ်</button>
      <button class="preset-btn" onclick="setPreset('analysis')">🔍 အကဲဖြတ်</button>
      <button class="preset-btn" onclick="setPreset('custom')">⚙️ ကိုယ်ပိုင်</button>
    </div>
    <textarea id="prompt" placeholder="စာအုပ်အကြောင်း ဘယ်လိုရေးချင်လဲ ပြောပါ...">ဒီစာအုပ်ရဲ့ မြန်မာဘာသာအညွှန်းကို အောက်ပါပုံစံအတိုင်း ရေးပေးပါ:

၁။ အစချုပ် - စာဖတ်သူကို မေးခွန်းတစ်ခုခုဖြင့် စတင်ပါ
၂။ ဇာတ်လမ်းအကျဉ်းချုပ် - spoiler မပါဘဲ ဖော်ပြပါ
၃။ ဇာတ်ကောင်များ - အဓိကဇာတ်ကောင်များနှင့် ၎င်းတို့ရဲ့ လက္ခဏာများ
၄။ အကြောင်းအရာ - စာအုပ်က ဘာကို ပြောပြနေတယ်
၅။ ကိုယ့်အမြင် - ကိုယ်တိုင်ဖတ်ပြီးခံစားရတာ
၆။ အကြံပြုချက် - ဘယ်သူတွေ ဖတ်သင့်လဲ

ဘာသာစကား: မြန်မာဘာသာ၊ ရိုးရှင်းသည့်ဘာသာစကား၊ စကားပြောသကဲ့သို့ ရေးပါ။ Quote များကို bold သုံးပါ။ Word count: 300-500</textarea>
    <div class="char-count"><span id="promptCount">0</span> ဝါကျ</div>
  </div>

  <!-- Model Selector -->
  <div class="card">
    <h2>🤖 AI Model</h2>
    <select id="modelSelect" style="width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;background:rgba(255,255,255,0.04);color:#e0e0e0;font-family:inherit;font-size:0.9em">
      <option value="gemini-1.5-flash">gemini-1.5-flash (Free, ထိရောက်)</option>
      <option value="gemini-2.0-flash">gemini-2.0-flash (Free, မြန်)</option>
      <option value="gemini-1.5-pro">gemini-1.5-pro (Paid, အကောင်းဆုံး)</option>
    </select>
  </div>

  <!-- Generate -->
  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-primary" id="generateBtn" onclick="generateReview()">
      <span id="btnText">🤖 အညွှန်းရေးပါ</span>
    </button>
  </div>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <!-- Result -->
  <div class="card result" id="resultCard">
    <h2>📝 ရလဒ်</h2>
    <div class="result-content" id="resultContent"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="copyResult()">📋 Copy</button>
      <button class="btn btn-secondary" onclick="downloadResult()">💾 Download .md</button>
      <button class="btn btn-secondary" onclick="resetAll()">🔄 အသစ်</button>
    </div>
  </div>
</div>

<script>
const PRESETS = {
  default: `ဒီစာအုပ်ရဲ့ မြန်မာဘာသာအညွှန်းကို အောက်ပါပုံစံအတိုင်း ရေးပေးပါ:

၁။ အစချုပ် - စာဖတ်သူကို မေးခွန်းတစ်ခုခုဖြင့် စတင်ပါ
၂။ ဇာတ်လမ်းအကျဉ်းချုပ် - spoiler မပါဘဲ ဖော်ပြပါ
၃။ ဇာတ်ကောင်များ - အဓိကဇာတ်ကောင်များနှင့် ၎င်းတို့ရဲ့ လက္ခဏာများ
၄။ အကြောင်းအရာ - စာအုပ်က ဘာကို ပြောပြနေတယ်
၅။ ကိုယ့်အမြင် - ကိုယ်တိုင်ဖတ်ပြီးခံစားရတာ
၆။ အကြံပြုချက် - ဘယ်သူတွေ ဖတ်သင့်လဲ

ဘာသာစကား: မြန်မာဘာသာ၊ ရိုးရှင်းသည့်ဘာသာစကား၊ စကားပြောသကဲ့သို့ ရေးပါ။ Quote များကို bold သုံးပါ။ Word count: 300-500`,

  summary: `ဒီစာအုပ်ရဲ့ အကျဉ်းချုပ်ကို မြန်မာဘာသာဖြင့် ရေးပေးပါ:

၁။ စာအုပ်အကြောင်း အကျဉ်းချုပ် (ဘာအကြောင်းလဲ)
၂။ ဇာတ်လမ်းအဓိကအချက် (spoiler မပါဘဲ)
၃။ အဓိကသင်ခန်းစာ
၄။ ဘာကြောင့်ဖတ်သင့်လဲ

ရိုးရှင်းသည့် မြန်မာဘာသာဖြင့် 200-300 ဝါကျခန့် ရေးပါ။`,

  analysis: `ဒီစာအုပ်ကို အကဲဖြတ်သုံးသပ်ပြီး မြန်မာဘာသာဖြင့် ရေးပေးပါ:

၁။ စာရေးဆရာရဲ့ ရေးဟန်နှင့် အားသာချက်
၂။ ဇာတ်ကောင်ဖန်တီးမှု
၃။ ဇာတ်လမ်းဖွဲ့စည်းပုံ
၄။ အဓိကသင်ခန်းစာနှင့် အဓိပ္ပာယ်
၅။ အားနည်းချက်များ
၆။ ဘယ်သူတွေ ဖတ်သင့်လဲ

ဝေဖန်ပိုင်းခြားစွာ၊ မျှတစွာ ရေးပါ။ 300-500 ဝါကျခန့် ရေးပါ။`,

  custom: ``
};

let currentFile = null;
let currentFileName = '';

// API Key
const apiKeyInput = document.getElementById('apiKey');
apiKeyInput.addEventListener('input', () => {
  const key = apiKeyInput.value.trim();
  const dot = document.getElementById('apiStatus');
  const txt = document.getElementById('apiStatusText');
  if (key.length > 10) {
    dot.classList.add('ok');
    txt.textContent = 'API Key ထည့်ပြီးပါပြီ';
  } else {
    dot.classList.remove('ok');
    txt.textContent = 'API Key မထည့်ရသေးပါ';
  }
  localStorage.setItem('gemini_api_key', key);
});

// Load saved key
const savedKey = localStorage.getItem('gemini_api_key');
if (savedKey) {
  apiKeyInput.value = savedKey;
  apiKeyInput.dispatchEvent(new Event('input'));
}

// Prompt
const promptEl = document.getElementById('prompt');
promptEl.addEventListener('input', () => {
  document.getElementById('promptCount').textContent = promptEl.value.split(/\s+/).filter(Boolean).length;
});
promptEl.dispatchEvent(new Event('input'));

// File Upload
const fileInput = document.getElementById('bookFile');
const fileUpload = document.getElementById('fileUpload');

fileInput.addEventListener('change', handleFile);
fileUpload.addEventListener('dragover', e => { e.preventDefault(); fileUpload.classList.add('dragover'); });
fileUpload.addEventListener('dragleave', () => fileUpload.classList.remove('dragover'));
fileUpload.addEventListener('drop', e => {
  e.preventDefault();
  fileUpload.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    handleFile();
  }
});

function handleFile() {
  const file = fileInput.files[0];
  if (!file) return;
  currentFile = file;
  currentFileName = file.name;
  document.getElementById('fileName').textContent = `✅ ${file.name}`;
  document.getElementById('fileName').style.display = 'block';
  document.querySelector('.file-upload .icon').textContent = '✅';
  document.querySelector('.file-upload .text').innerHTML = `ဖိုင်ရွေးပြီးပါပြီ<br><small>${(file.size/1024).toFixed(1)} KB</small>`;
}

function setPreset(key) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  promptEl.value = PRESETS[key];
  promptEl.dispatchEvent(new Event('input'));
}

async function extractText(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  
  if (ext === 'txt') {
    return await file.text();
  }
  
  if (ext === 'epub') {
    const arrayBuffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(arrayBuffer);
    const files = Object.keys(zip.files).filter(f => f.match(/\.(xhtml|html|htm)$/i));
    let text = '';
    for (const f of files.slice(0, 20)) {
      const content = await zip.files[f].async('string');
      const clean = content.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      if (clean.length > 50) text += clean + '\n\n';
    }
    return text;
  }
  
  if (ext === 'pdf') {
    // For PDF, send to Gemini as base64
    const arrayBuffer = await file.arrayBuffer();
    const base64 = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
    return { type: 'pdf', base64: base64, mimeType: 'application/pdf' };
  }
  
  throw new Error('Unsupported file type: ' + ext);
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}

async function generateReview() {
  const key = apiKeyInput.value.trim();
  if (!key) { showError('API Key ထည့်ပါ'); return; }
  if (!currentFile) { showError('စာအုပ်ဖိုင်တင်ပါ'); return; }
  
  const btn = document.getElementById('generateBtn');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> စဉ်းစားနေတယ်...';
  document.getElementById('errorMsg').classList.remove('show');
  
  try {
    showSuccess('ဖိုင်ဖတ်နေတယ်...');
    const extracted = await extractText(currentFile);
    
    showSuccess('AI က အညွှန်းရေးနေတယ်...');
    
    let parts = [];
    const userPrompt = promptEl.value || PRESETS.default;
    
    if (typeof extracted === 'object' && extracted.type === 'pdf') {
      parts = [
        { text: userPrompt + '\n\nစာအုပ် content:' },
        { inlineData: { mimeType: extracted.mimeType, data: extracted.base64 } }
      ];
    } else {
      const truncated = extracted.substring(0, 80000);
      parts = [{ text: userPrompt + '\n\nစာအုပ် content:\n\n' + truncated }];
    }
    
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${document.getElementById("modelSelect").value}:generateContent?key=${key}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: parts }],
          generationConfig: { temperature: 0.7, maxOutputTokens: 4096 }
        })
      }
    );
    
    const data = await response.json();
    
    if (data.error) {
      let errMsg = data.error.message || 'API Error';
      if (errMsg.includes('quota') || errMsg.includes('Quota')) {
        errMsg += '\n\n💡 ဖြေရှင်းနည်း:\n1. Model ကို gemini-1.5-flash ပြောင်းရွေးပါ\n2. API Key အသစ်ဖန်တီးပါ: https://aistudio.google.com/apikey\n3. 24 နာရီစောင့်ပါ';
      }
      throw new Error(errMsg);
    }
    
    const review = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!review) throw new Error('AI က အဖြေမပေးနိုင်ဘူး');
    
    document.getElementById('resultContent').innerHTML = review.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    document.getElementById('resultCard').classList.add('show');
    showSuccess('✅ အညွှန်းပြီးပါပြီ!');
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
    
  } catch (err) {
    showError('❌ ' + err.message);
  } finally {
    btn.disabled = false;
    btnText.textContent = '🤖 အညွှန်းရေးပါ';
  }
}

function copyResult() {
  const text = document.getElementById('resultContent').innerText;
  navigator.clipboard.writeText(text).then(() => showSuccess('📋 Copy ပြီးပါပြီ'));
}

function downloadResult() {
  const text = document.getElementById('resultContent').innerText;
  const name = currentFileName ? currentFileName.replace(/\.[^.]+$/, '') + '-review.md' : 'review.md';
  const blob = new Blob([text], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

function resetAll() {
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('successMsg').classList.remove('show');
}
</script>
